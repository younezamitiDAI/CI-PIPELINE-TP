
name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  ci:
    name: Lint and Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Recuperer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installer les dependances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Verifier le style du code
      - name: Lint with Flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 tests --count --max-line-length=127 --statistics

      # 5. Executer les tests
      - name: Run tests with coverage
        run: |
          python -m pytest -v --cov=app
