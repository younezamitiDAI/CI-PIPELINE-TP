
name: CI Pipeline Multi-Jobs

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # JOB 1 : Analyse statique
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      # Recuperer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer les dependances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      # Executer Flake8
      - name: Run Flake8
        run: |
          flake8 app --count --select=E9,F63,F7,F82,F841 --show-source --statistics
          flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 tests --count --max-line-length=127 --statistics

  # JOB 2 : Execution des tests
  test:
    name: Test
    runs-on: ubuntu-latest

    needs: lint

    steps:
      # Recuperer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installer les dependances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Executer Pytest avec couverture
      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=app
